<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>BreakBuddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <style>
    @layer base { html, body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; } }
    ::-webkit-scrollbar { display: none; }
    /* Prevent Caret Browsing cursor and accidental text selection to make the app feel native */
    body { user-select: none; -webkit-user-select: none; }
    input, textarea, [contenteditable] { user-select: text; -webkit-user-select: text; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0058be",
            "primary-container": "#2170e4",
            "on-primary": "#ffffff",
            "secondary": "#006c49",
            "secondary-container": "#6cf8bb",
            "on-secondary-container": "#00714d",
            "background": "#faf8ff",
            "surface": "#faf8ff",
            "surface-container": "#eaedff",
            "surface-container-low": "#f2f3ff",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#131b2e",
            "on-surface-variant": "#424754",
            "error": "#ba1a1a",
            "on-error": "#ffffff"
          }
        }
      }
    }
  </script>
  <script type="module" src="supabase-client.js"></script>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  
  <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[100px] -z-10 pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-secondary-container/30 blur-[100px] -z-10 pointer-events-none"></div>

  <div class="w-full max-w-md bg-surface-container-lowest p-8 md:p-10 rounded-3xl shadow-2xl border border-surface-container-low relative z-10">
    <div class="flex flex-col items-center mb-8 text-center">
      <img src="logo.svg" alt="BreakBuddy Logo" class="h-14 w-auto mb-4">
      <h1 class="text-3xl font-bold text-primary tracking-tight" id="authTitle">Welcome Back</h1>
      <p class="text-on-surface-variant mt-2" id="authSubtitle">Sign in to continue your wellness journey</p>
    </div>

    <form id="authForm" class="flex flex-col gap-5" onsubmit="event.preventDefault(); handleAuth();">
      <div id="nameField" class="hidden flex-col gap-1.5">
        <label class="text-sm font-semibold text-on-surface">Full Name</label>
        <input type="text" id="fullName" placeholder="Jane Doe" class="w-full px-4 py-3 rounded-xl bg-surface-container border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest outline-none transition-all placeholder:text-on-surface-variant/50">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-on-surface">Email Address</label>
        <input type="email" id="email" required placeholder="student@university.edu" class="w-full px-4 py-3 rounded-xl bg-surface-container border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest outline-none transition-all placeholder:text-on-surface-variant/50">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-on-surface">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-surface-container border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest outline-none transition-all placeholder:text-on-surface-variant/50">
      </div>

      <div id="errorMessage" class="hidden p-3 rounded-xl bg-error-container text-error text-sm font-medium items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">error</span>
        <span id="errorText"></span>
      </div>

      <button type="submit" id="submitBtn" class="mt-2 w-full py-3.5 rounded-xl bg-primary text-on-primary font-bold text-lg shadow-md hover:bg-primary-container hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <span id="btnText">Sign In</span>
        <span class="material-symbols-outlined text-[20px]" id="btnIcon">login</span>
      </button>
    </form>

    <div class="mt-8 text-center text-sm font-medium text-on-surface-variant">
      <span id="togglePrompt">Don't have an account?</span> 
      <button type="button" onclick="toggleMode()" class="text-primary hover:underline font-bold" id="toggleBtn">Sign up here</button>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase-client.js';

    let isSignUp = false;

    window.toggleMode = () => {
      isSignUp = !isSignUp;
      document.getElementById('authTitle').textContent = isSignUp ? 'Create Account' : 'Welcome Back';
      document.getElementById('authSubtitle').textContent = isSignUp ? 'Start your wellness journey today' : 'Sign in to continue your wellness journey';
      document.getElementById('nameField').className = isSignUp ? 'flex flex-col gap-1.5' : 'hidden flex-col gap-1.5';
      document.getElementById('submitBtn').className = isSignUp 
        ? 'mt-2 w-full py-3.5 rounded-xl bg-secondary text-on-secondary font-bold text-lg shadow-md hover:brightness-110 hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2'
        : 'mt-2 w-full py-3.5 rounded-xl bg-primary text-on-primary font-bold text-lg shadow-md hover:bg-primary-container hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2';
      document.getElementById('btnText').textContent = isSignUp ? 'Sign Up' : 'Sign In';
      document.getElementById('btnIcon').textContent = isSignUp ? 'person_add' : 'login';
      document.getElementById('togglePrompt').textContent = isSignUp ? 'Already have an account?' : 'Don\'t have an account?';
      document.getElementById('toggleBtn').textContent = isSignUp ? 'Sign in here' : 'Sign up here';
      document.getElementById('errorMessage').classList.add('hidden');
    };

    window.handleAuth = async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value;
      const submitBtn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');

      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';
      errorMsg.classList.add('hidden');

      try {
        if (isSignUp) {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: { full_name: fullName, avatar_url: 'profile.jpg' }
            }
          });
          if (error) throw error;
          // If successful, login and redirect
          window.location.href = 'dashboard.html';
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          });
          if (error) throw error;
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        errorText.textContent = err.message || 'An error occurred';
        errorMsg.classList.remove('hidden');
        errorMsg.classList.add('flex');
      } finally {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    };

    // Check if already logged in
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
